name: AlphaSMC Daily Scan
 
on:
  schedule:
    # 8:15 AM IST = 2:45 AM UTC
    - cron: '45 2 * * 1-5'   # Monday to Friday only
  workflow_dispatch:           # allows manual run from GitHub Actions tab
 
jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write          # needed to commit signals.json back to repo
 
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
 
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
 
      - name: Install dependencies
        run: pip install yfinance pandas pytz
 
      - name: Run AlphaSMC scan
        env:
          GMAIL_PASS: ${{ secrets.GMAIL_PASS }}
        run: python bot_scan.py
 
      - name: Commit signals.json to repo
        run: |
          git config user.name  "AlphaSMC Bot"
          git config user.email "alphapatel23@gmail.com"
          git add signals.json
          git diff --staged --quiet || git commit -m "AlphaSMC scan $(date +'%Y-%m-%d %H:%M IST')"
          git push
 









